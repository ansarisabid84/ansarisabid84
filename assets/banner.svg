<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
<title id="t">Sabid Ansari — Lead Software Engineer</title>
<desc id="d">Lead Software Engineer at Accenture. Java, Spring Boot, Python, Django, React, AWS. Leading a 12-member cross-functional team and shipping offline-first Android and iOS apps. Hyderabad, India.</desc>
<defs>
  <radialGradient id="gA" cx="0.85" cy="0.2" r="0.6"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="gB" cx="0.6" cy="1.1" r="0.6"><stop offset="0" stop-color="#7c3aed" stop-opacity=".35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  <clipPath id="card"><rect width="1280" height="440" rx="28"/></clipPath>
  <style>
    .sans { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .orbit { animation: spin 40s linear infinite; transform-origin: 0 0; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .ping { animation: ping 2.2s ease-out infinite; transform-origin: 82px 383px; }
    @keyframes ping { 0% { transform: scale(1); opacity: .7 } 100% { transform: scale(3.2); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .orbit, .ping { animation: none } }
  </style>
</defs>
<g clip-path="url(#card)">
  <rect width="1280" height="440" fill="#0a0e17"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect width="1280" height="440" fill="url(#gA)"/>
  <rect width="1280" height="440" fill="url(#gB)"/>

  <!-- right: monogram with orbiting tech ring -->
  <g transform="translate(1010 220)">
    <circle r="150" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
    <circle class="orbit" r="118" fill="none" stroke="url(#brand)" stroke-opacity=".6" stroke-dasharray="4 10"/>
    <circle r="84" fill="#111827" stroke="url(#brand)" stroke-width="3"/>
    <text class="sans" x="0" y="20" text-anchor="middle" font-size="58" font-weight="700" fill="url(#brand)">SA</text>
  </g>
  <g>
    <g class="mono" font-size="15" fill="#cbd5e1">
      <g transform="translate(1010 70)"><rect x="-46" y="-16" width="92" height="30" rx="15" fill="#111827" stroke="#334155"/><text y="5" text-anchor="middle">Java 21</text></g>
      <g transform="translate(1150 160)"><rect x="-56" y="-16" width="112" height="30" rx="15" fill="#111827" stroke="#334155"/><text y="5" text-anchor="middle">Spring Boot</text></g>
      <g transform="translate(1130 320)"><rect x="-36" y="-16" width="72" height="30" rx="15" fill="#111827" stroke="#334155"/><text y="5" text-anchor="middle">AWS</text></g>
      <g transform="translate(1010 372)"><rect x="-44" y="-16" width="88" height="30" rx="15" fill="#111827" stroke="#334155"/><text y="5" text-anchor="middle">Django</text></g>
      <g transform="translate(875 310)"><rect x="-40" y="-16" width="80" height="30" rx="15" fill="#111827" stroke="#334155"/><text y="5" text-anchor="middle">React</text></g>
      <g transform="translate(870 140)"><rect x="-44" y="-16" width="88" height="30" rx="15" fill="#111827" stroke="#334155"/><text y="5" text-anchor="middle">Kotlin</text></g>
    </g>
  </g>

  <!-- left: identity -->
  <text class="mono" x="72" y="92" font-size="18" fill="#22d3ee" letter-spacing="3">LEAD SOFTWARE ENGINEER · ACCENTURE</text>
  <text class="sans" x="70" y="172" font-size="76" font-weight="800" fill="#f8fafc">Sabid Ansari</text>
  <rect x="72" y="194" width="300" height="5" rx="2.5" fill="url(#brand)"/>
  <text class="sans" x="72" y="246" font-size="26" fill="#cbd5e1">Building, deploying and running production platforms —</text>
  <text class="sans" x="72" y="282" font-size="26" fill="#cbd5e1">backend, cloud, security and mobile.</text>

  <g class="mono" font-size="16" fill="#e2e8f0">
    <rect x="72" y="312" width="190" height="36" rx="18" fill="#111827" stroke="#22d3ee" stroke-opacity=".6"/>
    <text x="167" y="336" text-anchor="middle">12-member team</text>
    <rect x="276" y="312" width="226" height="36" rx="18" fill="#111827" stroke="#818cf8" stroke-opacity=".6"/>
    <text x="389" y="336" text-anchor="middle">4 apps on Google Play</text>
    <rect x="516" y="312" width="186" height="36" rx="18" fill="#111827" stroke="#c084fc" stroke-opacity=".6"/>
    <text x="609" y="336" text-anchor="middle">Linode → AWS</text>
  </g>

  <circle class="ping" cx="82" cy="383" r="6" fill="#22c55e"/>
  <circle cx="82" cy="383" r="6" fill="#22c55e"/>
  <text class="mono" x="100" y="389" font-size="16" fill="#94a3b8">Open to Engineering Lead roles · Hyderabad, India</text>
</g>
</svg>
